<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog RWD</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style-boceto.css">
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="nav">
        <h1>Barra de navegación</h1>
    </nav>

    <!-- JUMBOTRON -->
    <section class="jumbotron text-center">
        <h1>Jumbotron</h1>
    </section>

    <!-- PARTE CENTRAL: una única fila con 2 bloques -->
    <section class="main container text-center">
        <div class="row">

            <!-- Artículos + paginación -->
            <section class="col-md-9">
                <article class="articulo mx-1">
                    <h1>Artículo #1</h1>
                </article>
                <article class="articulo mx-1">
                    <h1>Artículo #2</h1>
                </article>
                <article class="articulo mx-1">
                    <h1>Artículo #3</h1>
                </article>
                <nav class="paginacion mx-1">
                    <h3>Paginación</h3>
                </nav>
            </section>

            <!-- Barra lateral -->
            <aside class="aside col-md-3">
                <h1>Aside</h1>
            </aside>

        </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer text-center">
        <h1>Footer</h1>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN" crossorigin="anonymous"></script>
</body>
</html>
